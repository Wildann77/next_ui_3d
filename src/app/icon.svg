<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Obsidian luxury dark radial/linear gradient -->
    <linearGradient id="noirPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141618" />
      <stop offset="100%" stop-color="#090A0C" />
    </linearGradient>
    <!-- Terracotta Volt electric gradient -->
    <linearGradient id="voltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5D1A" />
      <stop offset="100%" stop-color="#E63F00" />
    </linearGradient>
    <!-- Editorial Bone gradient -->
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#ECE4D8" />
    </linearGradient>
  </defs>

  <!-- 1. Obsidian Brutalist Rounded Base Plate -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#noirPlateGrad)" stroke="#F3ECE1" stroke-opacity="0.16" stroke-width="1.5" />

  <!-- 2. Hairline Inner Accent Border -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="11" fill="none" stroke="#F3ECE1" stroke-opacity="0.06" stroke-width="1" />

  <!-- 3. Micro Brutalist HUD Elements -->
  <!-- Corner Registration Crosshair (Top-Left) -->
  <line x1="8" y1="11" x2="14" y2="11" stroke="#F3ECE1" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="square" />
  <line x1="11" y1="8" x2="11" y2="14" stroke="#F3ECE1" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="square" />

  <!-- Terracotta Volt Kinetic Diamond (Bottom-Right) -->
  <polygon points="52.5,49.5 55.5,52.5 52.5,55.5 49.5,52.5" fill="url(#voltGrad)" />

  <!-- 4. Monogram 'N' (Editorial Bone) -->
  <!-- Left Pillar -->
  <rect x="12.5" y="18" width="5.5" height="28" rx="0.5" fill="url(#boneGrad)" />
  <!-- Diagonal Strut -->
  <polygon points="12.5,18 18,18 29.5,46 24,46" fill="url(#boneGrad)" />
  <!-- Right Pillar -->
  <rect x="24" y="18" width="5.5" height="28" rx="0.5" fill="url(#boneGrad)" />

  <!-- 5. Dual Kinetic Slashes '//' (Terracotta Volt) -->
  <!-- Primary Slash -->
  <polygon points="38.5,18 43,18 37,46 32.5,46" fill="url(#voltGrad)" />
  <!-- Secondary Slash -->
  <polygon points="47.5,18 52,18 46,46 41.5,46" fill="url(#voltGrad)" />
</svg>